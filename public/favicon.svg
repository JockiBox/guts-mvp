<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
  </defs>
  <!-- Vibrant teal background -->
  <circle cx="16" cy="16" r="15" fill="url(#grad)"/>
  <!-- Bold white border -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="#fff" stroke-width="2"/>
  <!-- White card shape -->
  <rect x="8" y="5" width="16" height="22" rx="3" fill="#ffffff"/>
  <rect x="8" y="5" width="16" height="22" rx="3" fill="none" stroke="#0d9488" stroke-width="1"/>
  <!-- Bold G -->
  <text x="16" y="22" font-family="Arial Black, sans-serif" font-size="16" font-weight="900" fill="#0d9488" text-anchor="middle">G</text>
</svg>
