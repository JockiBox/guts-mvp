<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)" stroke="#14b8a6" stroke-width="4"/>

  <!-- Card 1 (left, tilted) -->
  <g transform="translate(130, 120) rotate(-15, 60, 100)" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="170" rx="12" fill="#1e293b" stroke="url(#cardGrad)" stroke-width="3"/>
    <text x="15" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#14b8a6">A</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="24" fill="#ef4444">&#9829;</text>
    <text x="60" y="110" font-family="Arial, sans-serif" font-size="48" fill="#ef4444">&#9829;</text>
  </g>

  <!-- Card 2 (center) -->
  <g transform="translate(196, 140)" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="170" rx="12" fill="#1e293b" stroke="url(#cardGrad)" stroke-width="3"/>
    <text x="15" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#14b8a6">K</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="24" fill="#14b8a6">&#9824;</text>
    <text x="60" y="110" font-family="Arial, sans-serif" font-size="48" fill="#14b8a6">&#9824;</text>
  </g>

  <!-- Card 3 (right, tilted) -->
  <g transform="translate(262, 120) rotate(15, 60, 100)" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="170" rx="12" fill="#1e293b" stroke="url(#cardGrad)" stroke-width="3"/>
    <text x="15" y="40" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#14b8a6">Q</text>
    <text x="15" y="70" font-family="Arial, sans-serif" font-size="24" fill="#ef4444">&#9830;</text>
    <text x="60" y="110" font-family="Arial, sans-serif" font-size="48" fill="#ef4444">&#9830;</text>
  </g>

  <!-- GUTS text -->
  <text x="256" y="400" font-family="Arial Black, sans-serif" font-size="72" font-weight="bold" fill="url(#cardGrad)" text-anchor="middle" filter="url(#glow)">GUTS</text>
</svg>
