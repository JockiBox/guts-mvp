<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fcd34d"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Vibrant teal background -->
  <circle cx="256" cy="256" r="250" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="240" fill="none" stroke="#fff" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Bold white border -->
  <circle cx="256" cy="256" r="250" fill="none" stroke="#fff" stroke-width="12"/>

  <!-- Main card (white, centered) -->
  <g transform="translate(156, 80)" filter="url(#shadow)">
    <rect x="0" y="0" width="200" height="280" rx="20" fill="#ffffff"/>
    <rect x="0" y="0" width="200" height="280" rx="20" fill="none" stroke="#0d9488" stroke-width="6"/>

    <!-- Big G in center -->
    <text x="100" y="200" font-family="Arial Black, sans-serif" font-size="180" font-weight="900" fill="url(#bgGrad)" text-anchor="middle">G</text>

    <!-- Corner suits -->
    <text x="25" y="50" font-family="Arial, sans-serif" font-size="36" fill="#ef4444">&#9829;</text>
    <text x="175" y="260" font-family="Arial, sans-serif" font-size="36" fill="#ef4444" text-anchor="end">&#9829;</text>
  </g>

  <!-- Sparkle accents -->
  <g filter="url(#glow)">
    <text x="100" y="150" font-size="40" fill="url(#goldGrad)">&#10022;</text>
    <text x="412" y="150" font-size="40" fill="url(#goldGrad)">&#10022;</text>
    <text x="100" y="400" font-size="32" fill="url(#goldGrad)">&#10022;</text>
    <text x="412" y="400" font-size="32" fill="url(#goldGrad)">&#10022;</text>
  </g>

  <!-- GUTS text at bottom -->
  <text x="256" y="440" font-family="Arial Black, sans-serif" font-size="64" font-weight="900" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">GUTS</text>
</svg>
